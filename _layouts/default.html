<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (error) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    }());
  </script>
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
</head>
<body>

<header>
  <div class="wrap">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes' or page.layout == 'post' %} class="active"{% endif %}>Notes</a>
      <a href="{{ '/tools/' | relative_url }}"{% if page.url contains '/tools' %} class="active"{% endif %}>Tools</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="active"{% endif %}>About</a>
      <button class="theme-toggle" type="button" aria-label="Switch color theme">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>

<footer>
  <div class="wrap">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</span>
    <span>
      <a href="mailto:{{ site.author.email }}">Email</a> &middot;
      <a href="https://github.com/{{ site.author.github }}">GitHub</a> &middot;
      <a href="https://linkedin.com/in/{{ site.author.linkedin }}">LinkedIn</a> &middot;
      <a href="https://t.me/{{ site.author.telegram }}">Telegram</a>
    </span>
  </div>
</footer>

<script>
  (function () {
    var root = document.documentElement;
    var button = document.querySelector('.theme-toggle');
    var systemTheme = window.matchMedia('(prefers-color-scheme: dark)');

    function getStoredTheme() {
      try {
        var theme = localStorage.getItem('theme');
        return theme === 'light' || theme === 'dark' ? theme : null;
      } catch (error) {
        return null;
      }
    }

    function updateButton() {
      var nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      var label = 'Switch to ' + nextTheme + ' theme';
      button.setAttribute('aria-label', label);
      button.setAttribute('title', label);
    }

    button.addEventListener('click', function () {
      var theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', theme);
      try { localStorage.setItem('theme', theme); } catch (error) {}
      updateButton();
    });

    systemTheme.addEventListener('change', function (event) {
      if (!getStoredTheme()) {
        root.setAttribute('data-theme', event.matches ? 'dark' : 'light');
        updateButton();
      }
    });

    updateButton();
  }());
</script>

</body>
</html>
